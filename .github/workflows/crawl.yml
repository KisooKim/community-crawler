name: Crawl Communities

on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다
  workflow_dispatch: # 수동 실행

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DEBUG: "false"
        run: |
          python3 -c "
          from app.services.crawler_service import CrawlerService
          results = CrawlerService.crawl_all_parallel(max_workers=3, exclude=list(CrawlerService.BLOCKED_SITES))
          for r in results:
              status = 'OK' if 'error' not in r else 'FAIL'
              name = r.get('site', 'unknown')
              count = r.get('processed', 0)
              print(f'{status} {name}: {count} articles')
          "
